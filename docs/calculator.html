<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IGCSE Marks Calculator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      background: #f4f6fb;
      color: #1a1f36;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    h1, h2 {
      margin: 0 0 .75rem;
    }
    .toolbar {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin-bottom: .75rem;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: .55rem .8rem;
      font-weight: 600;
      cursor: pointer;
      background: #1f6feb;
      color: #fff;
    }
    button.secondary {
      background: #5c6370;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 720px;
    }
    th, td {
      border-bottom: 1px solid #e6e9f0;
      padding: .5rem;
      text-align: left;
      vertical-align: middle;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccd2df;
      border-radius: 6px;
      padding: .45rem;
    }
    .error input {
      border-color: #d92d20;
      background: #fff4f3;
    }
    .readonly {
      font-weight: 700;
    }
    .status-pass {
      color: #067647;
      font-weight: 700;
    }
    .status-review {
      color: #b54708;
      font-weight: 700;
    }
    .status-invalid {
      color: #d92d20;
      font-weight: 700;
    }
    .error-box {
      border-radius: 8px;
      background: #fff4f3;
      border: 1px solid #f4b4af;
      padding: .6rem;
      color: #b42318;
      margin: .5rem 0 .75rem;
      display: none;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: .75rem;
      margin-top: .75rem;
    }
    .metric {
      background: #f8f9fd;
      border-radius: 8px;
      padding: .6rem;
    }
    .metric strong {
      display: block;
      font-size: 1.2rem;
      margin-top: .15rem;
    }
    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: .75rem;
    }
    canvas {
      width: 100%;
      height: 220px;
      border: 1px solid #e6e9f0;
      border-radius: 10px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>IGCSE Marks Calculator</h1>
      <p>Enter or edit marks to instantly convert to PUM, view grade/status, and track trends.</p>
      <div id="errors" class="error-box" aria-live="polite" role="alert"></div>
      <div class="toolbar">
        <button id="addRow" type="button">Add Subject Row</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Subject</th>
              <th>Raw Mark</th>
              <th>Max Mark</th>
              <th>Converted PUM</th>
              <th>Grade</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="marksBody"></tbody>
        </table>
      </div>
      <div class="metrics">
        <div class="metric">Valid Subjects<strong id="subjectCount">0</strong></div>
        <div class="metric">Average PUM<strong id="avgPum">0.0</strong></div>
        <div class="metric">Total Raw Marks<strong id="totalRaw">0</strong></div>
        <div class="metric">Overall Status<strong id="overallStatus">N/A</strong></div>
      </div>
    </div>

    <div class="card">
      <h2>Marks Graphs</h2>
      <div class="charts">
        <div>
          <p><strong>Raw Marks by Subject</strong></p>
          <canvas id="rawChart" width="500" height="220" role="img" aria-label="Bar chart showing raw marks by subject"></canvas>
        </div>
        <div>
          <p><strong>PUM Trend</strong></p>
          <canvas id="pumChart" width="500" height="220" role="img" aria-label="Line chart showing PUM trend across subjects"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const defaults = {
      "Mathematics": 200,
      "English Language": 160,
      "Physics": 160,
      "Chemistry": 160,
      "Biology": 160,
      "Computer Science": 150
    };

    const marksBody = document.getElementById("marksBody");
    const errorBox = document.getElementById("errors");
    const MIN_CHART_SCALE = 1;
    const MIN_BAR_WIDTH = 18;
    const BAR_GAP = 10;
    const MAX_LABEL_LENGTH = 8;
    const DATA_POINT_RADIUS = 3.5;

    function gradeFromPum(pum) {
      if (pum >= 90) return "A*";
      if (pum >= 80) return "A";
      if (pum >= 70) return "B";
      if (pum >= 60) return "C";
      if (pum >= 50) return "D";
      if (pum >= 40) return "E";
      if (pum >= 30) return "F";
      if (pum >= 20) return "G";
      return "U";
    }

    function addRow(subject = "", raw = "", max = "") {
      const row = document.createElement("tr");
      const subjectCell = document.createElement("td");
      const subjectInput = document.createElement("input");
      subjectInput.type = "text";
      subjectInput.className = "subject";
      subjectInput.placeholder = "e.g. Mathematics";
      subjectInput.setAttribute("aria-label", "Subject name");
      subjectInput.value = subject;
      subjectCell.appendChild(subjectInput);

      const rawCell = document.createElement("td");
      const rawInput = document.createElement("input");
      rawInput.type = "number";
      rawInput.className = "raw";
      rawInput.min = "0";
      rawInput.step = "0.1";
      rawInput.setAttribute("aria-label", "Raw mark");
      rawInput.value = raw;
      rawCell.appendChild(rawInput);

      const maxCell = document.createElement("td");
      const maxInput = document.createElement("input");
      maxInput.type = "number";
      maxInput.className = "max";
      maxInput.min = "0.1";
      maxInput.step = "0.1";
      maxInput.setAttribute("aria-label", "Maximum mark");
      maxInput.value = max;
      maxCell.appendChild(maxInput);

      const pumCell = document.createElement("td");
      pumCell.className = "readonly pum";
      pumCell.textContent = "-";

      const gradeCell = document.createElement("td");
      gradeCell.className = "readonly grade";
      gradeCell.textContent = "-";

      const statusCell = document.createElement("td");
      statusCell.className = "readonly status";
      statusCell.textContent = "-";

      const actionCell = document.createElement("td");
      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "secondary remove";
      removeButton.setAttribute("aria-label", "Remove this subject row");
      removeButton.textContent = "Remove";
      actionCell.appendChild(removeButton);

      row.append(subjectCell, rawCell, maxCell, pumCell, gradeCell, statusCell, actionCell);
      marksBody.appendChild(row);

      row.querySelector(".subject").addEventListener("input", () => {
        const subjectInput = row.querySelector(".subject");
        const maxInput = row.querySelector(".max");
        const maybeMax = defaults[subjectInput.value.trim()];
        if (maybeMax && !maxInput.value) {
          maxInput.value = maybeMax;
        }
        recalculate();
      });

      row.querySelectorAll("input").forEach((input) => {
        input.addEventListener("input", recalculate);
      });

      row.querySelector(".remove").addEventListener("click", () => {
        row.remove();
        if (!marksBody.children.length) {
          addRow();
        }
        recalculate();
      });
    }

    function recalculate() {
      const rows = Array.from(marksBody.querySelectorAll("tr"));
      const errors = [];
      const validRows = [];

      rows.forEach((row, index) => {
        row.classList.remove("error");
        const subject = row.querySelector(".subject").value.trim() || `Subject ${index + 1}`;
        const raw = Number(row.querySelector(".raw").value);
        const max = Number(row.querySelector(".max").value);
        const pumCell = row.querySelector(".pum");
        const gradeCell = row.querySelector(".grade");
        const statusCell = row.querySelector(".status");
        row.querySelector(".remove").setAttribute("aria-label", `Remove ${subject} row`);

        if (!Number.isFinite(raw) || !Number.isFinite(max) || max <= 0 || raw < 0 || raw > max) {
          row.classList.add("error");
          pumCell.textContent = "Invalid";
          gradeCell.textContent = "-";
          statusCell.textContent = "Fix input";
          statusCell.className = "readonly status status-invalid";
          errors.push(`${subject}: enter a valid raw mark between 0 and max mark.`);
          return;
        }

        // Percentage Uniform Mark (PUM): (raw / max) * 100 rounded to 1 decimal place.
        // Multiplying by 1000 then dividing by 10 keeps a numeric value while rounding to 0.1.
        const pum = Math.round((raw / max) * 1000) / 10;
        const grade = gradeFromPum(pum);
        const status = pum >= 40 ? "Pass" : "Review";

        pumCell.textContent = pum.toFixed(1);
        gradeCell.textContent = grade;
        statusCell.textContent = status;
        statusCell.className = `readonly status ${status === "Pass" ? "status-pass" : "status-review"}`;

        validRows.push({ subject, raw, pum });
      });

      if (errors.length) {
        errorBox.style.display = "block";
        errorBox.textContent = "";
        const heading = document.createElement("strong");
        heading.textContent = "Validation:";
        const list = document.createElement("ul");
        errors.forEach((message) => {
          const item = document.createElement("li");
          item.textContent = message;
          list.appendChild(item);
        });
        errorBox.appendChild(heading);
        errorBox.appendChild(list);
      } else {
        errorBox.style.display = "none";
        errorBox.textContent = "";
      }

      const subjectCount = validRows.length;
      const totalRaw = validRows.reduce((sum, row) => sum + row.raw, 0);
      const avgPum = subjectCount ? validRows.reduce((sum, row) => sum + row.pum, 0) / subjectCount : 0;

      document.getElementById("subjectCount").textContent = String(subjectCount);
      document.getElementById("totalRaw").textContent = totalRaw.toFixed(1);
      document.getElementById("avgPum").textContent = avgPum.toFixed(1);
      document.getElementById("overallStatus").textContent = !subjectCount
        ? "N/A"
        : avgPum >= 40
          ? "On Track"
          : "Needs Improvement";

      drawBarChart("rawChart", validRows.map((r) => r.subject), validRows.map((r) => r.raw), "#1f6feb");
      drawLineChart("pumChart", validRows.map((r) => r.subject), validRows.map((r) => r.pum), "#7a3cff");
    }

    function drawBarChart(canvasId, labels, values, color) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      if (!values.length) {
        canvas.setAttribute("aria-label", "Raw marks chart: no valid rows to plot");
        ctx.fillStyle = "#5c6370";
        ctx.fillText("No valid rows to plot.", 12, 30);
        return;
      }
      canvas.setAttribute("aria-label", "Raw marks chart by subject");

      const maxValue = Math.max(...values, MIN_CHART_SCALE);
      const padding = 30;
      const barAreaWidth = w - padding * 2;
      const barWidth = Math.max(MIN_BAR_WIDTH, barAreaWidth / values.length - BAR_GAP);

      values.forEach((v, i) => {
        const x = padding + i * (barAreaWidth / values.length) + 4;
        const barHeight = ((h - padding * 2) * v) / maxValue;
        const y = h - padding - barHeight;

        ctx.fillStyle = color;
        ctx.fillRect(x, y, barWidth, barHeight);
        ctx.fillStyle = "#1a1f36";
        ctx.font = "12px Arial";
        ctx.fillText(String(v.toFixed(1)), x, y - 4);
        ctx.fillText(labels[i].slice(0, MAX_LABEL_LENGTH), x, h - 10);
      });
    }

    function drawLineChart(canvasId, labels, values, color) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      if (!values.length) {
        canvas.setAttribute("aria-label", "PUM trend chart: no valid rows to plot");
        ctx.fillStyle = "#5c6370";
        ctx.fillText("No valid rows to plot.", 12, 30);
        return;
      }
      canvas.setAttribute("aria-label", "PUM trend chart across subjects");

      const padding = 30;
      const xStep = values.length > 1 ? (w - padding * 2) / (values.length - 1) : 0;

      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      values.forEach((v, i) => {
        const x = values.length === 1 ? w / 2 : padding + i * xStep;
        const y = h - padding - ((h - padding * 2) * v) / 100;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      values.forEach((v, i) => {
        const x = values.length === 1 ? w / 2 : padding + i * xStep;
        const y = h - padding - ((h - padding * 2) * v) / 100;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, DATA_POINT_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#1a1f36";
        ctx.font = "12px Arial";
        ctx.fillText(v.toFixed(1), x - 10, y - 8);
        ctx.fillText(labels[i].slice(0, MAX_LABEL_LENGTH), x - 12, h - 10);
      });
    }

    document.getElementById("addRow").addEventListener("click", () => {
      addRow();
      recalculate();
    });

    addRow("Mathematics", "156", "200");
    addRow("Physics", "123", "160");
    addRow("English Language", "110", "160");
    recalculate();
  </script>
</body>
</html>
