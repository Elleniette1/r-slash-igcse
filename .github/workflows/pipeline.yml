name: R/IGCSE Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 1 * *'

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate pipeline entrypoint
        run: |
          python -m py_compile githubpipeline.py
          python -c "import githubpipeline"

  schedule-data:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Extract schedule
        run: python githubpipeline.py schedule
      - name: Validate schedule schema
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv('output/schedule/schedule.csv')
          required = {'id', 'pdf_links', 'subject_code', 'month', 'month_id', 'year'}
          missing = required.difference(df.columns)
          if missing:
              raise SystemExit(f'Missing schedule columns: {sorted(missing)}')
          if df.empty:
              raise SystemExit('schedule.csv is empty')
          print(f'schedule rows: {len(df)}')
          PY
      - name: Upload schedule artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-data
          path: output/schedule/schedule.csv
          retention-days: 30

  download-pdfs:
    needs: schedule-data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download schedule artifact
        uses: actions/download-artifact@v4
        with:
          name: schedule-data
          path: output/schedule
      - name: Download PDFs
        run: python githubpipeline.py downtag
      - name: Validate downloaded PDFs
        run: |
          python - <<'PY'
          from pathlib import Path

          pdfs = list(Path('output/pdf').glob('*.pdf'))
          if not pdfs:
              raise SystemExit('No PDFs downloaded to output/pdf')
          empty = [str(p) for p in pdfs if p.stat().st_size == 0]
          if empty:
              raise SystemExit(f'Empty PDF files found: {empty[:5]}')
          print(f'pdf count: {len(pdfs)}')
          PY
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-downloads
          path: output/pdf
          retention-days: 30

  extract-csvs:
    needs: download-pdfs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-downloads
          path: output/pdf
      - name: Extract CSV tables
        run: python githubpipeline.py extract
      - name: Validate extracted CSVs
        run: |
          python - <<'PY'
          from pathlib import Path

          csvs = list(Path('output/csv').glob('*.csv'))
          if not csvs:
              raise SystemExit('No extracted CSV files in output/csv')
          print(f'extracted csv count: {len(csvs)}')
          PY
      - name: Upload extracted CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-csvs
          path: output/csv
          retention-days: 30

  compile-tables:
    needs: extract-csvs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download extracted CSV artifact
        uses: actions/download-artifact@v4
        with:
          name: extracted-csvs
          path: output/csv
      - name: Compile subject tables
        run: python githubpipeline.py compile
      - name: Validate compiled tables
        run: |
          python - <<'PY'
          from pathlib import Path

          tables = list(Path('output/table').glob('*_all.csv'))
          if not tables:
              raise SystemExit('No compiled tables generated in output/table')
          print(f'compiled table count: {len(tables)}')
          PY
      - name: Upload compiled tables artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tables
          path: output/table
          retention-days: 30
